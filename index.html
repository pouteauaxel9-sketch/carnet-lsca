<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#009640">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet LSCA">
<title>Carnet Formation — GJ LSCA / Louverné</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <nav class="topnav" aria-label="Navigation principale">
    <a href="./" class="nav-logo" aria-label="Accueil Louverné Sports">
      <img src="assets/logo-louverne-sports.png" alt="Louverné Sports" class="nav-logo-img">
      <span class="nav-logo-text">Carnet Formation</span>
    </a>
    <div class="nav-cat-tabs" id="nav-cat-tabs" role="tablist" aria-label="Categories"></div>
    <div class="nav-right">
      <button class="btn btn-ghost more-actions-btn" id="more-actions-btn" type="button" aria-haspopup="true" aria-expanded="false" title="Menu">
        <span class="mab-icon">⋯</span>
      </button>
      <div class="more-menu" id="more-menu" hidden role="menu">
        <div class="more-menu-slot" id="more-menu-educator"></div>
        <div class="more-menu-section">
          <label class="more-menu-label" for="season-sel">Saison</label>
          <select class="season-sel" id="season-sel" aria-label="Choix de la saison"></select>
        </div>
        <div class="more-menu-divider"></div>
        <button class="more-menu-item" type="button" id="refresh-btn" role="menuitem">🔄 <span>Actualiser</span></button>
        <button class="more-menu-item" type="button" id="export-xlsx-btn" role="menuitem" title="Exporter en Excel">📊 <span>Exporter Excel</span></button>
        <button class="more-menu-item install-chip" type="button" data-action="install-pwa" id="install-pwa-item" hidden role="menuitem">📱 <span>Installer l'app</span></button>
        <div class="more-menu-divider"></div>
        <button class="more-menu-item" type="button" data-action="trigger-import" role="menuitem">📂 <span>Importer JSON</span></button>
        <button class="more-menu-item" type="button" data-action="trigger-export-json" role="menuitem">💾 <span>Exporter JSON</span></button>
      </div>
      <input id="import-file" class="sr-only" type="file" accept="application/json">
    </div>
  </nav>

  <div class="main-layout">
    <aside class="sidebar" aria-label="Liste des joueurs">
      <div class="sb-head">
        <div class="sb-search-wrap">
          <label class="sr-only" for="sb-search">Rechercher un joueur</label>
          <input class="sb-search" id="sb-search" type="search" placeholder="Rechercher un joueur...">
          <button class="search-clear" id="search-clear" type="button" aria-label="Effacer la recherche">x</button>
        </div>
        <div class="sb-meta">
          <span id="sb-count">0 joueur</span>
          <span id="sb-season-chip">Saison</span>
        </div>
        <div class="sb-actions">
          <button class="sb-action-btn" type="button" data-action="open-roster-create" title="Ajouter un joueur">+ Joueur</button>
          <button class="sb-action-btn sb-action-btn--ghost" type="button" data-action="open-roster-manage" title="Gérer l'effectif">Gérer l'effectif</button>
          <button class="sb-action-btn sb-action-btn--ghost" type="button" data-action="open-season-transition" title="Reprise de saison : décider qui reste, monte, quitte">🔄 Reprise</button>
        </div>
      </div>
      <div class="sb-filters" id="sb-filters" aria-label="Filtres"></div>
      <div class="player-list" id="player-list"></div>
    </aside>

    <main class="main-content" id="main-content">
      <div class="empty-state">
        <p>Selectionne un joueur dans la liste pour afficher son carnet.</p>
      </div>
    </main>
  </div>
</div>

<div class="toast" id="toast" aria-live="polite"></div>

<script src="app.js"></script>
<script src="auth-local.js"></script>
<script src="evaluation-seance.js"></script>
<script src="observation-match.js"></script>
<script src="roster.js"></script>
<script src="post-match.js"></script>
<script src="excel-export.js"></script>
<script src="team-view.js"></script>
<script src="transverse-view.js"></script>
<script src="attendance.js"></script>
<script src="injury.js"></script>
<script src="profiling.js"></script>
<script src="directeur-view.js"></script>
<script src="career.js"></script>
<script src="weekly-focus.js"></script>
<script src="season-plan.js"></script>
<script src="advanced-stats.js"></script>
<script src="ux-polish.js"></script>
<script src="live-training.js"></script>
<script src="sessions-history.js"></script>
<script src="season-transition.js"></script>
<script src="pdf-logos.js"></script>
<script src="pdf-report.js"></script>
<script src="pwa.js"></script>
</body>
</html>
