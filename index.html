<link rel="stylesheet" href="styles.css">
<script>
/* One-shot cleanup — purge l'ancien service worker + caches périmés.
   S'exécute une seule fois par navigateur, marqué par localStorage. */
(function() {
  var KEY = 'cfb_sw_reset_v3_1_0';
  if (localStorage.getItem(KEY) === 'done') return;
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      var hadOldSW = regs.length > 0;
      Promise.all(regs.map(function(r) { return r.unregister(); })).then(function() {
        var cachesPromise = ('caches' in window)
          ? caches.keys().then(function(keys) { return Promise.all(keys.map(function(k) { return caches.delete(k); })); })
          : Promise.resolve();
        cachesPromise.then(function() {
          localStorage.setItem(KEY, 'done');
          if (hadOldSW) {
            console.log('[Carnet] Ancien service worker purgé — reload en cours');
            location.reload();
          }
        });
      });
    }).catch(function(err) { console.warn('[Carnet] SW cleanup failed', err); });
  } else {
    localStorage.setItem(KEY, 'done');
  }
})();
</script>
</head>
<body>
<div class="app-shell">
  <nav class="topnav" aria-label="Navigation principale">
    <a href="./" class="nav-logo" aria-label="Accueil Louverné Sports">

        <button class="more-menu-item" type="button" data-action="trigger-import" role="menuitem">📂 Importer JSON</button>

      </div>

  </nav>

  <div class="main-layout">
    <aside class="sidebar" aria-label="Liste des joueurs">

        <div class="sb-search-wrap">
          <label class="sr-only" for="sb-search">Rechercher un joueur</label>

          <button class="search-clear" id="search-clear" type="button" aria-label="Effacer la recherche">x</button>
        </div>
        <div class="sb-meta">
          <span id="sb-count">0 joueur</span>
          <span id="sb-season-chip">Saison</span>
        </div>
        <div class="sb-actions">
          <button class="sb-action-btn" type="button" data-action="open-roster-create" title="Ajouter un joueur">+ Joueur</button>
          <button class="sb-action-btn sb-action-btn--ghost" type="button" data-action="open-roster-manage" title="Gérer l'effectif">Gérer l'effectif</button>
          <button class="sb-action-btn sb-action-btn--ghost" type="button" data-action="open-season-transition" title="Reprise de saison : décider qui reste, monte, quitte">🔄 Reprise</button>
        </div>
      </div>
      <div class="sb-filters" id="sb-filters" aria-label="Filtres"></div>
      <div class="player-list" id="player-list"></div>
    </aside>

    <main class="main-content" id="main-content">
      <div class="empty-state">
        <p>Selectionne un joueur dans la liste pour afficher son carnet.</p>
      </div>
    </main>
