name: Scrape FFF Standings

on:
  # Chaque lundi à 7h UTC = 8h hiver / 9h été France
  # Les classements FFF ne bougent qu'après les matchs du week-end.
  schedule:
    - cron: '0 7 * * 1'
  # Déclenchement manuel depuis l'onglet "Actions" du repo
  workflow_dispatch:
  # Déclenchement automatique quand on modifie la config des URLs ou le script
  push:
    branches: [main]
    paths:
      - 'data/fff-urls.json'
      - 'scripts/scrape-fff-standings.js'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Nécessaire pour pouvoir re-push avec les credentials du GITHUB_TOKEN
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scraper (via ScraperAPI)
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: node scripts/scrape-fff-standings.js

      - name: Diagnostics avant commit
        run: |
          echo "─── git status ───"
          git status
          echo "─── diff standings.json ───"
          git diff --stat data/standings.json || true
          echo "─── contenu début fichier ───"
          head -c 300 data/standings.json

      - name: Commit standings si changement
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/standings.json
          if git diff --cached --quiet; then
            echo "⚪ Aucun changement — rien à commiter"
          else
            git commit -m "chore(fff): refresh standings $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:main
            echo "✅ Classements commités et poussés sur main"
          fi
