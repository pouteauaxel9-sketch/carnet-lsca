name: Sync FFF Data

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lancer le scraper (API JSON, sans Puppeteer)
        run: node scrape-fff.js
        working-directory: scripts

      - name: Committer les données mises à jour
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/feeds.json
          git diff --staged --quiet || git commit -m "sync: données FFF du $(date +'%d/%m/%Y') [skip ci]"
          git pull --rebase
          git push
