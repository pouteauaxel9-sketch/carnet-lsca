name: Scrape SportEasy

on:
  # Chaque jour à 5h UTC = 6h France hiver / 7h France été
  # Après les présences validées de la veille au soir.
  schedule:
    - cron: '0 5 * * *'
  # Déclenchement manuel depuis l'onglet "Actions" du repo
  workflow_dispatch:
  # Re-run quand on modifie le script
  push:
    branches: [main]
    paths:
      - 'scripts/scrape-sporteasy.js'
      - '.github/workflows/scrape-sporteasy.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer + Chromium
        run: |
          npm init -y
          npm install puppeteer@22

      - name: Run SportEasy scraper
        env:
          SPORTEASY_EMAIL:    ${{ secrets.SPORTEASY_EMAIL }}
          SPORTEASY_PASSWORD: ${{ secrets.SPORTEASY_PASSWORD }}
        run: node scripts/scrape-sporteasy.js

      - name: Diagnostics avant commit
        if: always()
        run: |
          echo "─── git status ───"
          git status
          echo "─── taille data/sporteasy.json ───"
          wc -c data/sporteasy.json 2>/dev/null || echo "(fichier absent)"
          echo "─── début fichier ───"
          head -c 500 data/sporteasy.json 2>/dev/null || true

      - name: Commit sporteasy.json si changement
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sporteasy.json data/_sporteasy-debug.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "⚪ Aucun changement — rien à commiter"
          else
            git commit -m "chore(sporteasy): refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:main
            echo "✅ SportEasy data commité"
          fi
